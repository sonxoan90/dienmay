{% load shop_extras %}
<div class="col-6 col-md-4 col-lg-3">
  <div class="card h-100 shadow-sm">
    {% if p.image %}
      <img src="{{ p.image.url }}" class="card-img-top p-2" alt="{{ p.name }}" style="height:180px;object-fit:contain">
    {% else %}
      <div class="bg-light d-flex align-items-center justify-content-center text-muted" style="height:180px">Chưa có ảnh</div>
    {% endif %}
    <div class="card-body d-flex flex-column">
      <div class="small text-muted">{{ p.brand.name }}</div>
      <h6 class="card-title"><a class="stretched-link text-decoration-none" href="{% url 'product_detail' p.slug %}">{{ p.name }}</a></h6>
      <div class="mt-auto">
        <span class="fw-bold text-danger">{{ p.final_price|vnd }}</span>
        {% if p.sale_price %}<del class="small text-muted ms-1">{{ p.price|vnd }}</del>{% endif %}
      </div>
    </div>
  </div>
</div>
