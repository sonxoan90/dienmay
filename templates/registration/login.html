<!-- templates/registration/login.html -->
{% extends 'base.html' %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <h3 class="mb-3">Đăng nhập</h3>
  <form method="post" class="card card-body">
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors|join:" " }}</div>{% endif %}
    {% include 'registration/_form_fields.html' %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary" type="submit">Đăng nhập</button>
    <p class="mt-3 mb-0 small">Chưa có tài khoản? <a href="{% url 'signup' %}">Đăng ký</a></p>
  </form>
</div></div>
{% endblock %}
