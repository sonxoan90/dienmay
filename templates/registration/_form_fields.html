<!-- templates/registration/_form_fields.html : vẽ mọi ô của 1 form, dùng lại ở 3 trang -->
{% for field in form %}
  <div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
    {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
  </div>
{% endfor %}
